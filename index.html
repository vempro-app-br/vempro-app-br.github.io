<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>VemPro</title>
<meta name="description" content="Aplicativos da VemPro.">
<style>
@font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 400; font-display: swap; src: url('fontes/AtkinsonHyperlegible-Regular.ttf') format('truetype'); }
@font-face { font-family: 'Lora'; font-weight: 600; font-display: swap; src: url('fontes/Lora-SemiBold.ttf') format('truetype'); }
/* Cores dos temas Claro e Escuro do Palavra. */
:root { --fundo: #F4F6FA; --texto: #13233F; --texto2: #3A4864; --primaria: #1F3D73; --cartao: #FFFFFF; --borda: #D5DCE8; }
@media (prefers-color-scheme: dark) {
  :root { --fundo: #0D1426; --texto: #EEEAE0; --texto2: #C3CADA; --primaria: #F2C46D; --cartao: #16213A; --borda: #2A3757; }
}
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--fundo); color: var(--texto); font: 400 1.25rem/1.6 'Atkinson Hyperlegible', system-ui, sans-serif; }
main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
h1, h2 { font-family: Lora, Georgia, serif; font-weight: 600; line-height: 1.25; color: var(--primaria); }
h1 { font-size: 2.5rem; margin: 0 0 0.25rem; }
h2 { font-size: 1.5rem; margin: 0 0 0.5rem; }
p { margin: 0 0 1rem; }
.apps { list-style: none; padding: 0; margin: 2rem 0; }
.apps li { background: var(--cartao); border: 1px solid var(--borda); border-radius: 16px; padding: 1.25rem 1.25rem 0.25rem; }
a { color: var(--primaria); text-decoration-thickness: 2px; text-underline-offset: 3px; overflow-wrap: anywhere; }
.contato { color: var(--texto2); }
</style>
</head>
<body>
<main>
<h1>VemPro</h1>
<p class="contato">Aplicativos da VemPro.</p>
<ul class="apps">
  <li>
    <h2>Palavra</h2>
    <p>A palavra do dia e a Bíblia completa para ler, ouvir, buscar e compartilhar, com letra grande.</p>
    <p><a href="palavra/privacidade/">Política de privacidade do Palavra</a></p>
  </li>
</ul>
<p class="contato">Contato: <a href="mailto:jean.sassi.miranda@gmail.com">jean.sassi.miranda@gmail.com</a></p>
</main>
</body>
</html>
